<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03050c">
<title>Grid Runner: Cyber Survivor</title>

<!-- Configurações PWA e Atalho no Ecrã Principal -->
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GridRunner">
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicAppleIcon" rel="apple-touch-icon">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#03050c; color:#00f0ff; font-family:"Rajdhani",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; justify-content:center; align-items:center; }
  #app { width:100%; max-width:500px; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; background:#03050c; overflow:hidden; border: 1px solid rgba(0,240,255,0.2); }
  #hud { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:rgba(5,10,25,0.95); border-bottom:1px solid rgba(0,240,255,0.2); flex-shrink:0; z-index:5; }
  .hstat { display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .hstat .val { font-size:13px; font-weight:800; text-shadow:0 0 8px currentColor; }
  .hstat .lbl { font-size:7px; font-weight:700; color:#5a80a2; margin-top:2px; letter-spacing:0.5px; }
  .hstat.score .val { color:#00f0ff; }
  .hstat.best .val { color:#ffb703; }
  .hstat.level .val { color:#9d4edd; }
  .hstat.energy .val { color:#00f0ff; }
  #gamewrap { flex:1; width:100%; position:relative; background:#03050c; overflow:hidden; }
  canvas#cv { display:block; width:100%; height:100%; touch-action:none; }
  #xpBarContainer { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,240,255,0.1); z-index:6; }
  #xpBar { height:100%; background:#ffb703; width:0%; transition:width 0.1s linear; box-shadow:0 0 8px #ffb703; }

  #bossBarContainer { position:absolute; top:6px; left:20px; right:20px; height:6px; background:rgba(255,0,85,0.2); border-radius:3px; z-index:7; display:none; overflow:hidden; border:1px solid #ff0055; }
  #bossBar { height:100%; background:#ff0055; width:100%; box-shadow:0 0 10px #ff0055; }
  
  #screenOverlay { position:absolute; inset:0; background:rgba(3,5,12,0.94); backdrop-filter:blur(5px); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; z-index:30; text-align:center; }
  #screenOverlay.hidden { display:none; }
  .menu-card { max-width:380px; width:100%; background:#070e22; border:1px solid rgba(0,240,255,0.3); border-radius:14px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0,240,255,0.1); }
  .title { font-size:26px; font-weight:900; color:#00f0ff; margin-bottom:8px; text-shadow:0 0 12px rgba(0,240,255,0.6); }
  .subtitle { font-size:12px; color:#7a9cb8; font-weight:700; margin-bottom:20px; }
  .btn { width:100%; padding:16px; border-radius:10px; background:#00f0ff; border:none; color:#03050c; font-weight:900; font-size:15px; cursor:pointer; box-shadow:0 0 20px rgba(0,240,255,0.5); margin-top:10px; }
  .btn:active { transform:scale(0.97); }

  #infoAlert { position:absolute; top:18%; left:50%; transform:translateX(-50%); background:rgba(5,10,25,0.95); border:1px solid #00f0ff; color:#00f0ff; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:800; pointer-events:none; opacity:0; transition:opacity 0.3s; z-index:20; box-shadow:0 0 15px rgba(0,240,255,0.4); text-align:center; }
  #infoAlert.show { opacity:1; }

  /* Mensagem de Alerta de Chegada do Boss */
  #bossBanner { position:absolute; top:40%; left:50%; transform:translate(-50%, -50%) scale(0.8); background:rgba(255,0,85,0.92); border:2px solid #fff; color:#fff; padding:16px 24px; border-radius:12px; font-size:16px; font-weight:900; pointer-events:none; opacity:0; transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:25; box-shadow:0 0 30px rgba(255,0,85,0.8); text-align:center; letter-spacing:1px; }
  #bossBanner.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div id="app">
  <div id="xpBarContainer"><div id="xpBar"></div></div>
  <div id="bossBarContainer"><div id="bossBar"></div></div>
  <div id="hud">
    <div class="hstat score"><div class="val" id="scoreLbl">0</div><div class="lbl">PONTOS</div></div>
    <div class="hstat best"><div class="val" id="bestLbl">0</div><div class="lbl">RECORDE</div></div>
    <div class="hstat level"><div class="val" id="levelLbl">Nv. 1</div><div class="lbl">NÍVEL</div></div>
    <div class="hstat energy"><div class="val" id="energyLbl">100%</div><div class="lbl">ENERGIA</div></div>
  </div>
  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <div id="infoAlert"></div>
    <div id="bossBanner">⚠️ ALERTA DE AMEAÇA CRÍTICA<br><span style="font-size:20px; color:#ffb703;">GIGABYTE BOSS APROXIMA-SE!</span></div>
  </div>

  <div id="screenOverlay">
    <div class="menu-card">
      <div class="title">GRID RUNNER</div>
      <div class="subtitle" id="menuSubtitle">Modo Hardcore Definitivo: Bosses com alerta áudio/háptico a cada 5 níveis, células temporizadas e sobrevivência!</div>
      <button class="btn" id="startBtn">INICIALIZAR SISTEMA</button>
    </div>
  </div>
</div>

<script>
"use strict";

// Gerador de Som Sintetizado (Web Audio API)
let audioCtx = null;
function playBossAlertSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.6);

    gain.gain.setValueAtTime(0.25, audioCtx.currentTime); // Volume suave para não irritar
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  } catch(_) {}
}

(function generateAppIcon() {
  const iconCv = document.createElement('canvas');
  iconCv.width = 512; iconCv.height = 512;
  const ictx = iconCv.getContext('2d');

  const grad = ictx.createRadialGradient(256, 256, 0, 256, 256, 256);
  grad.addColorStop(0, '#070e22');
  grad.addColorStop(1, '#03050c');
  ictx.fillStyle = grad;
  ictx.beginPath();
  ictx.roundRect(0, 0, 512, 512, 110);
  ictx.fill();

  ictx.strokeStyle = '#00f0ff';
  ictx.lineWidth = 8;
  ictx.globalAlpha = 0.4;
  ictx.beginPath();
  ictx.roundRect(32, 32, 448, 448, 90);
  ictx.stroke();
  ictx.globalAlpha = 1.0;

  ictx.strokeStyle = '#ff0055';
  ictx.lineWidth = 12;
  ictx.shadowColor = '#ff0055';
  ictx.shadowBlur = 15;
  ictx.beginPath();
  ictx.moveTo(256, 90); ictx.lineTo(400, 174); ictx.lineTo(400, 338);
  ictx.lineTo(256, 422); ictx.lineTo(112, 338); ictx.lineTo(112, 174);
  ictx.closePath();
  ictx.stroke();

  ictx.fillStyle = 'rgba(0, 240, 255, 0.15)';
  ictx.strokeStyle = '#00f0ff';
  ictx.lineWidth = 10;
  ictx.shadowColor = '#00f0ff';
  ictx.shadowBlur = 15;
  ictx.beginPath();
  ictx.moveTo(256, 130); ictx.lineTo(366, 194); ictx.lineTo(366, 318);
  ictx.lineTo(256, 382); ictx.lineTo(146, 318); ictx.lineTo(146, 194);
  ictx.closePath();
  ictx.fill();
  ictx.stroke();

  ictx.fillStyle = '#00f0ff';
  ictx.beginPath();
  ictx.arc(256, 256, 65, 0, Math.PI * 2);
  ictx.fill();

  ictx.fillStyle = '#fff';
  ictx.beginPath();
  ictx.arc(256, 256, 30, 0, Math.PI * 2);
  ictx.fill();

  const iconDataUrl = iconCv.toDataURL('image/png');
  document.getElementById('dynamicFavicon').href = iconDataUrl;
  document.getElementById('dynamicAppleIcon').href = iconDataUrl;
})();

const SAVE_KEY = "gridRunnerBestScoreV20";
const PROGRESS_KEY = "gridRunnerActiveProgressV10";
let bestScore = 0;
try { const saved = localStorage.getItem(SAVE_KEY); if (saved) bestScore = parseInt(saved, 10) || 0; } catch(_) {}

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const scoreLbl = document.getElementById("scoreLbl"), bestLbl = document.getElementById("bestLbl"), levelLbl = document.getElementById("levelLbl"), energyLbl = document.getElementById("energyLbl");
const xpBar = document.getElementById("xpBar"), bossBarContainer = document.getElementById("bossBarContainer"), bossBar = document.getElementById("bossBar");
const screenOverlay = document.getElementById("screenOverlay"), startBtn = document.getElementById("startBtn");
const menuSubtitle = document.getElementById("menuSubtitle");
const infoAlert = document.getElementById("infoAlert"), bossBanner = document.getElementById("bossBanner");

bestLbl.textContent = bestScore;

let running = false, score = 0, level = 1, xp = 0, maxXp = 45, energy = 100;
let pendingUpgradeModule = null;
let energyCells = [];
let currentBoss = null;

let idleTimer = 0;
let isOverheating = false;

let player = { x: 0, y: 0, radius: 14, speed: 3.8, fireRate: 35, fireTimer: 0, damage: 1, bulletCount: 1, range: 170, weaponType: "plasma" };
let enemies = [], gems = [], bullets = [];
let joystick = { active: false, id: null, startX: 0, startY: 0, curX: 0, curY: 0, dx: 0, dy: 0 };
let keys = {};

let alertTimer = 0;
function showAlert(msg) {
  infoAlert.textContent = msg;
  infoAlert.classList.add("show");
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => infoAlert.classList.remove("show"), 2500);
}

function triggerBossBanner() {
  bossBanner.classList.add("show");
  playBossAlertSound();
  if (navigator.vibrate) {
    navigator.vibrate([100, 50, 100, 50, 200]); // Padrão de vibração suave
  }
  setTimeout(() => {
    bossBanner.classList.remove("show");
  }, 2800);
}

function resizeCanvas(){
  const wrap = document.getElementById("gamewrap");
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || 400;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

let hasSavedProgress = false;
try {
  const savedProg = localStorage.getItem(PROGRESS_KEY);
  if (savedProg) {
    const p = JSON.parse(savedProg);
    if (p && p.energy > 0) {
      hasSavedProgress = true;
      score = p.score || 0;
      level = p.level || 1;
      xp = p.xp || 0;
      maxXp = p.maxXp || 45;
      energy = p.energy || 100;
      pendingUpgradeModule = p.pendingUpgradeModule || null;
      energyCells = p.energyCells || [];
      if (p.player) {
        player.x = p.player.x || 0;
        player.y = p.player.y || 0;
        player.speed = p.player.speed || 3.8;
        player.fireRate = p.player.fireRate || 35;
        player.damage = p.player.damage || 1;
        player.bulletCount = p.player.bulletCount || 1;
        player.range = p.player.range || 170;
        player.weaponType = p.player.weaponType || "plasma";
      }
    }
  }
} catch(_) {
  hasSavedProgress = false;
}

if (hasSavedProgress) {
  menuSubtitle.textContent = `Progresso guardado (Nv. ${level}, ${score} pts). Clica abaixo para continuar!`;
  startBtn.textContent = "CONTINUAR PARTIDA";
}

function saveProgress() {
  if (!running) return;
  try {
    const data = {
      score, level, xp, maxXp, energy, pendingUpgradeModule, energyCells,
      player: { x: player.x, y: player.y, speed: player.speed, fireRate: player.fireRate, damage: player.damage, bulletCount: player.bulletCount, range: player.range, weaponType: player.weaponType }
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  } catch(_) {}
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch(_) {}
}

function startGame(resume = false){
  resizeCanvas();
  const w = cv.clientWidth || window.innerWidth;
  const h = cv.clientHeight || 400;

  if (!resume || !hasSavedProgress) {
    clearProgress();
    player.x = w / 2;
    player.y = h / 2;
    score = 0; level = 1; xp = 0; maxXp = 45; energy = 100;
    pendingUpgradeModule = null;
    energyCells = [];
    currentBoss = null;
    bossBarContainer.style.display = "none";
    player.speed = 3.8; player.fireRate = 35; player.damage = 1; player.bulletCount = 1; player.range = 170; player.weaponType = "plasma";
    enemies = []; gems = []; bullets = [];
  } else {
    player.x = Math.max(player.radius, Math.min(w - player.radius, player.x || w / 2));
    player.y = Math.max(player.radius, Math.min(h - player.radius, player.y || h / 2));
  }

  idleTimer = 0;
  isOverheating = false;
  screenOverlay.classList.add("hidden");
  running = true;
  updateHUD();
}

startBtn.addEventListener("click", () => startGame(hasSavedProgress));

window.addEventListener("beforeunload", () => { saveProgress(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) saveProgress();
});

window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  if (!joystick.active) {
    joystick.active = true;
    joystick.id = e.pointerId;
    joystick.startX = e.clientX - r.left;
    joystick.startY = e.clientY - r.top;
    joystick.curX = joystick.startX;
    joystick.curY = joystick.startY;
    joystick.dx = 0; joystick.dy = 0;
  }
});

cv.addEventListener("pointermove", e => {
  if (!joystick.active || e.pointerId !== joystick.id) return;
  const r = cv.getBoundingClientRect();
  joystick.curX = e.clientX - r.left;
  joystick.curY = e.clientY - r.top;
  const dx = joystick.curX - joystick.startX;
  const dy = joystick.curY - joystick.startY;
  const dist = Math.hypot(dx, dy);
  const maxRadius = 45;

  if (dist > 0) {
    const angle = Math.atan2(dy, dx);
    const clampedDist = Math.min(dist, maxRadius);
    joystick.dx = (Math.cos(angle) * clampedDist) / maxRadius;
    joystick.dy = (Math.sin(angle) * clampedDist) / maxRadius;
  }
});

function endJoystick(e) {
  if (joystick.active && e.pointerId === joystick.id) {
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
  }
}
cv.addEventListener("pointerup", endJoystick);
cv.addEventListener("pointercancel", endJoystick);

function updateHUD(){
  scoreLbl.textContent = score;
  bestLbl.textContent = bestScore;
  levelLbl.textContent = "Nv. " + level;
  xpBar.style.width = Math.min(100, (xp / maxXp) * 100) + "%";
  energyLbl.textContent = Math.max(0, energy) + "%";
  if (currentBoss) {
    bossBar.style.width = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100) + "%";
  }
}

function spawnEnemy(){
  if (currentBoss) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * w; y = -20; }
  else if (edge === 1) { x = Math.random() * w; y = h + 20; }
  else if (edge === 2) { x = -20; y = Math.random() * h; }
  else { x = w + 20; y = Math.random() * h; }

  const types = ["bug", "glitch", "worm"];
  const type = types[Math.floor(Math.random() * Math.min(types.length, 1 + Math.floor(level/2)))];
  let hp = 1, speed = 1.9, color = "#70e000", radius = 9;
  if (type === "glitch") { hp = 2; speed = 2.5; color = "#00f0ff"; radius = 10; }
  else if (type === "worm") { hp = 4; speed = 1.2; color = "#ff0055"; radius = 14; }

  enemies.push({ x, y, hp, maxHp: hp, speed: speed * (1 + level * 0.04), color, radius, type });
}

function spawnBoss(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const bossHp = 40 + (level * 15);
  currentBoss = {
    x: w / 2, y: -50,
    radius: 28,
    hp: bossHp,
    maxHp: bossHp,
    speed: 1.6 + (level * 0.02),
    color: "#ff0055"
  };
  bossBarContainer.style.display = "block";
  triggerBossBanner();
}

function spawnUpgradeModule(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const multiplier = 1 + (level * 0.05);
  
  const types = [
    { title: `⚡ Overclock Avançado [Nv.${level}]`, apply: () => { player.fireRate = Math.max(8, player.fireRate * 0.82); } },
    { title: `🎯 Módulo de Precisão Tática [Nv.${level}]`, apply: () => { player.range += Math.round(35 * multiplier); } },
    { title: `⚔️ Núcleo de Plasma Pesado [Nv.${level}]`, apply: () => { player.damage += Math.max(1, Math.round(1 + level * 0.1)); } },
    { title: `💥 Canhão Laser Multi-Feixe [Nv.${level}]`, apply: () => { player.bulletCount += 1; player.weaponType = "dual"; } },
    { title: `🌟 Canhão Orbitante V-Laser [Nv.${level}]`, apply: () => { player.bulletCount = Math.min(5, player.bulletCount + 1); player.weaponType = "triple"; } }
  ];
  
  const chosen = types[Math.floor(Math.random() * types.length)];
  pendingUpgradeModule = {
    x: Math.random() * (w - 80) + 40,
    y: Math.random() * (h - 80) + 40,
    radius: 18,
    data: chosen
  };
  showAlert(`🎁 MÓDULO SUPERIOR: ${chosen.title}!`);
}

function spawnEnergyCell(){
  const w = cv.clientWidth, h = cv.clientHeight;
  energyCells.push({
    x: Math.random() * (w - 60) + 30,
    y: Math.random() * (h - 60) + 30,
    radius: 12,
    value: 25,
    life: 480
  });
}

let spawnTimer = 0;
let energyCellTimer = 0;
let saveTimer = 0;

function update(){
  if (!running) return;

  const w = cv.clientWidth, h = cv.clientHeight;

  saveTimer++;
  if (saveTimer >= 300) {
    saveTimer = 0;
    saveProgress();
  }

  energyCellTimer++;
  if (energyCellTimer >= 850 && energyCells.length < 2) {
    energyCellTimer = 0;
    spawnEnergyCell();
  }

  let vx = 0, vy = 0;
  let isMoving = false;
  if (keys["w"] || keys["arrowup"]) { vy -= 1; isMoving = true; }
  if (keys["s"] || keys["arrowdown"]) { vy += 1; isMoving = true; }
  if (keys["a"] || keys["arrowleft"]) { vx -= 1; isMoving = true; }
  if (keys["d"] || keys["arrowright"]) { vx += 1; isMoving = true; }

  if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
  
  if (joystick.dx !== 0 || joystick.dy !== 0) {
    vx = joystick.dx;
    vy = joystick.dy;
    isMoving = true;
  }

  if (!isMoving) {
    idleTimer++;
    if (idleTimer > 180) {
      isOverheating = true;
      if (idleTimer % 60 === 0) {
        energy -= 10;
        showAlert("🔥 ALERTA: SOBREAQUECIMENTO DA GRELHA (-10% ENERGIA)!");
        updateHUD();
        if (energy <= 0) {
          running = false;
          clearProgress();
          hasSavedProgress = false;
          if (score > bestScore) {
            bestScore = score;
            try { localStorage.setItem(SAVE_KEY, bestScore.toString()); } catch(_) {}
          }
          screenOverlay.classList.remove("hidden");
          document.querySelector(".title").textContent = "FALHA DE SISTEMA";
          document.querySelector(".subtitle").innerHTML = `Pontuação: <b>${score}</b> | Recorde: <b>${bestScore}</b><br>Nível atingido: ${level}`;
          startBtn.textContent = "TENTAR DE NOVO";
          return;
        }
      }
    }
  } else {
    idleTimer = 0;
    isOverheating = false;
  }

  player.x += vx * player.speed;
  player.y += vy * player.speed;
  player.x = Math.max(player.radius, Math.min(w - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(h - player.radius, player.y));

  if (currentBoss) {
    const angle = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x);
    currentBoss.x += Math.cos(angle) * currentBoss.speed;
    currentBoss.y += Math.sin(angle) * currentBoss.speed;

    if (Math.hypot(currentBoss.x - player.x, currentBoss.y - player.y) < currentBoss.radius + player.radius) {
      energy -= 50;
      updateHUD();
      if (energy <= 0) {
        running = false;
        clearProgress();
        hasSavedProgress = false;
        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem(SAVE_KEY, bestScore.toString()); } catch(_) {}
        }
        screenOverlay.classList.remove("hidden");
        document.querySelector(".title").textContent = "FALHA DE SISTEMA";
        document.querySelector(".subtitle").innerHTML = `Pontuação: <b>${score}</b> | Recorde: <b>${bestScore}</b><br>Nível atingido: ${level}`;
        startBtn.textContent = "TENTAR DE NOVO";
      }
    }
  } else {
    spawnTimer++;
    if (spawnTimer >= Math.max(15, 55 - level * 3)) {
      spawnTimer = 0;
      spawnEnemy();
    }
  }

  player.fireTimer++;
  if (player.fireTimer >= player.fireRate) {
    let target = null, minDist = player.range;
    if (currentBoss) {
      target = currentBoss;
    } else {
      enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < minDist) { minDist = d; target = e; }
      });
    }

    if (target) {
      player.fireTimer = 0;
      const angle = Math.atan2(target.y - player.y, target.x - player.x);
      for (let i = 0; i < player.bulletCount; i++) {
        const spread = (i - (player.bulletCount - 1) / 2) * 0.18;
        bullets.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle + spread) * 8.5,
          vy: Math.sin(angle + spread) * 8.5,
          dmg: player.damage, life: 60,
          type: player.weaponType
        });
      }
    }
  }

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; });
  bullets = bullets.filter(b => b.life > 0);

  enemies.forEach(e => {
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
      const collisionDamage = level >= 10 ? 34 + (level - 10) * 8 : 34;
      energy -= collisionDamage;
      e.hp = 0;
      updateHUD();
      if (energy <= 0) {
        running = false;
        clearProgress();
        hasSavedProgress = false;
        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem(SAVE_KEY, bestScore.toString()); } catch(_) {}
        }
        screenOverlay.classList.remove("hidden");
        document.querySelector(".title").textContent = "FALHA DE SISTEMA";
        document.querySelector(".subtitle").innerHTML = `Pontuação: <b>${score}</b> | Recorde: <b>${bestScore}</b><br>Nível atingido: ${level}`;
        startBtn.textContent = "TENTAR DE NOVO";
      }
    }
  });

  bullets.forEach(b => {
    if (currentBoss) {
      if (Math.hypot(currentBoss.x - b.x, currentBoss.y - b.y) < currentBoss.radius + 4) {
        currentBoss.hp -= b.dmg;
        b.life = 0;
        updateHUD();
        if (currentBoss.hp <= 0) {
          score += 250;
          if (score > bestScore) bestScore = score;
          showAlert("🏆 BOSS ELIMINADO! SISTEMA ESTABILIZADO!");
          bossBarContainer.style.display = "none";
          currentBoss = null;
          spawnUpgradeModule();
        }
      }
    } else {
      enemies.forEach(e => {
        if (e.hp > 0 && Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
          e.hp -= b.dmg;
          b.life = 0;
          if (e.hp <= 0) {
            score += 15;
            if (score > bestScore) bestScore = score;
            if (!pendingUpgradeModule) {
              gems.push({ x: e.x, y: e.y, value: 10 });
            }
          }
        }
      });
    }
  });
  enemies = enemies.filter(e => e.hp > 0);

  energyCells.forEach(cell => {
    cell.life--;
    const d = Math.hypot(player.x - cell.x, player.y - cell.y);
    if (d < player.radius + cell.radius) {
      cell.collected = true;
      energy = Math.min(100, energy + cell.value);
      showAlert(`🔋 ENERGIA RECARREGADA (+${cell.value}%)!`);
      updateHUD();
      saveProgress();
    }
  });
  energyCells = energyCells.filter(c => !c.collected && c.life > 0);

  if (!pendingUpgradeModule && !currentBoss) {
    gems.forEach(g => {
      const d = Math.hypot(player.x - g.x, player.y - g.y);
      if (d < 65) {
        g.x += (player.x - g.x) * 0.15;
        g.y += (player.y - g.y) * 0.15;
        if (d < player.radius + 6) {
          g.collected = true;
          xp += g.value;
          if (xp >= maxXp) {
            xp = maxXp;
            if (level % 5 === 0) {
              spawnBoss();
            } else {
              spawnUpgradeModule();
            }
          }
          updateHUD();
          saveProgress();
        }
      }
    });
    gems = gems.filter(g => !g.collected);
  } else if (pendingUpgradeModule) {
    const d = Math.hypot(player.x - pendingUpgradeModule.x, player.y - pendingUpgradeModule.y);
    if (d < player.radius + pendingUpgradeModule.radius) {
      pendingUpgradeModule.data.apply();
      showAlert(`✨ UPGRADE ADQUIRIDO: ${pendingUpgradeModule.data.title}!`);
      pendingUpgradeModule = null;
      level++;
      maxXp = Math.floor(maxXp * 1.5);
      xp = 0;
      updateHUD();
      saveProgress();
    }
  }
}

function render(){
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#03050c"; ctx.fillRect(0, 0, w, h);

  if (isOverheating || energy < 25) {
    ctx.strokeStyle = "rgba(255, 0, 85, 0.2)";
    ctx.lineWidth = 2;
  } else {
    ctx.strokeStyle = "rgba(0,240,255,0.03)";
    ctx.lineWidth = 1;
  }

  const step = 32;
  for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  if (isOverheating) {
    ctx.strokeStyle = "rgba(255, 0, 85, " + (0.3 + Math.sin(Date.now() / 100) * 0.2) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, 70 + ((Date.now() / 6) % 30), 0, Math.PI * 2);
    ctx.stroke();
  }

  if (currentBoss) {
    ctx.fillStyle = currentBoss.color;
    ctx.shadowColor = currentBoss.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(currentBoss.x, currentBoss.y, currentBoss.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.shadowBlur = 0;
  }

  energyCells.forEach(cell => {
    const alpha = cell.life < 120 && Math.floor(cell.life / 10) % 2 === 0 ? 0.3 : 1.0;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#00f0ff";
    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;

    if (cell.x < 0 || cell.x > w || cell.y < 0 || cell.y > h) {
      renderOffScreenArrow(cell.x, cell.y, "#00f0ff", w, h);
    }
  });

  if (!pendingUpgradeModule && !currentBoss) {
    gems.forEach(g => {
      ctx.fillStyle = "#ffb703";
      ctx.shadowColor = "#ffb703"; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  if (pendingUpgradeModule) {
    ctx.fillStyle = "#ffb703";
    ctx.shadowColor = "#ffb703"; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(pendingUpgradeModule.x, pendingUpgradeModule.y, pendingUpgradeModule.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(255, 183, 3, 0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pendingUpgradeModule.x, pendingUpgradeModule.y, pendingUpgradeModule.radius + ((Date.now() / 6) % 18), 0, Math.PI * 2);
    ctx.stroke();

    if (pendingUpgradeModule.x < 0 || pendingUpgradeModule.x > w || pendingUpgradeModule.y < 0 || pendingUpgradeModule.y > h) {
      renderOffScreenArrow(pendingUpgradeModule.x, pendingUpgradeModule.y, "#ffb703", w, h);
    }
  }

  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  bullets.forEach(b => {
    ctx.fillStyle = b.type === "triple" ? "#ffb703" : "#00f0ff";
    ctx.shadowColor = b.type === "triple" ? "#ffb703" : "#00f0ff";
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.type === "triple" ? 4 : 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  ctx.fillStyle = isOverheating ? "#ff0055" : "#00f0ff";
  ctx.shadowColor = isOverheating ? "#ff0055" : "#00f0ff";
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  if (joystick.active) {
    ctx.strokeStyle = "rgba(0,240,255,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joystick.startX, joystick.startY, 45, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(0,240,255,0.4)";
    ctx.beginPath(); ctx.arc(joystick.curX, joystick.curY, 20, 0, Math.PI * 2); ctx.fill();
  }
}

function renderOffScreenArrow(targetX, targetY, color, w, h) {
  const margin = 30;
  const clampedX = Math.max(margin, Math.min(w - margin, targetX));
  const clampedY = Math.max(margin, Math.min(h - margin, targetY));

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(clampedX, clampedY, 10, 0, Math.PI * 2);
  ctx.stroke();
}

let lastTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  lastTime = now;
  update();
  render();
}

resizeCanvas();
updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
