<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03050c">
<meta name="description" content="Grid Runner: Cyber Survivor — sobrevivência cyberpunk.">
<title>Grid Runner: Cyber Survivor</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GridRunner">
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicAppleIcon" rel="apple-touch-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#03050c;color:#00f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;position:fixed;inset:0}
#app{width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;background:#03050c;overflow:hidden;border:1px solid rgba(0,240,255,.2)}
#hud{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:9px 10px;background:rgba(5,10,25,.97);border-bottom:1px solid rgba(0,240,255,.2);flex-shrink:0;z-index:5}
.hstat{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.hstat .val{font-size:clamp(12px,3.4vw,15px);font-weight:900;text-shadow:0 0 8px currentColor;transition:transform .2s ease;display:inline-block}
.hstat .lbl{font-size:7px;font-weight:800;color:#6685a4;margin-top:3px;letter-spacing:.6px}
.score .val{color:#00f0ff}.best .val{color:#ffb703}.level .val{color:#bd83ff}.energy .val{color:#00f0ff}.coins .val{color:#ffd700}.wave .val{color:#00d9ff}
#pauseBtn{border:1px solid rgba(0,240,255,.4);background:#0a1930;color:#00f0ff;border-radius:8px;padding:7px 9px;font-weight:900;font-size:12px}
#gamewrap{flex:1;min-height:0;width:100%;position:relative;background:#03050c;overflow:hidden}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
#xpBarContainer{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(0,240,255,.1);z-index:6}
#xpBar{height:100%;background:#ffb703;width:0%;transition:width .12s linear;box-shadow:0 0 8px #ffb703}
#bossBarContainer{position:absolute;top:8px;left:18px;right:18px;height:7px;background:rgba(255,0,85,.2);border-radius:5px;z-index:7;display:none;overflow:hidden;border:1px solid #ff0055}
#bossBar{height:100%;background:#ff0055;width:100%;box-shadow:0 0 10px #ff0055;transition:width .08s linear}
#screenOverlay{position:absolute;inset:0;background:rgba(3,5,12,.94);backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;z-index:30;text-align:center;overflow:auto}
#screenOverlay.hidden{display:none}
.menu-card{max-width:390px;width:100%;background:#070e22;border:1px solid rgba(0,240,255,.35);border-radius:15px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.9),0 0 22px rgba(0,240,255,.1);max-height:100%;overflow-y:auto}
.title{font-size:clamp(23px,7vw,29px);font-weight:1000;color:#00f0ff;margin-bottom:8px;text-shadow:0 0 12px rgba(0,240,255,.6);letter-spacing:1px}
.subtitle{font-size:12px;color:#8ba8c3;font-weight:650;line-height:1.55;margin-bottom:15px}
.btn{width:100%;padding:14px 12px;border-radius:10px;background:#00e5f5;border:0;color:#03050c;font-weight:950;font-size:14px;cursor:pointer;box-shadow:0 0 18px rgba(0,240,255,.35);margin-top:9px;transition:opacity .25s, transform .15s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:#10243d;color:#bcefff;border:1px solid rgba(0,240,255,.35);box-shadow:none}
.btn.gold{background:#ffb703;color:#03050c;box-shadow:0 0 18px rgba(255,183,3,.4)}
.btn.locked{opacity:.35;pointer-events:none}
#infoAlert{position:absolute;top:12px;left:50%;transform:translateX(-50%) translateY(-40px);background:rgba(5,10,25,.96);border:1px solid #00f0ff;color:#00f0ff;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:900;pointer-events:none;opacity:0;transition:all .22s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:20;box-shadow:0 0 15px rgba(0,240,255,.3);text-align:center;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#infoAlert.show{opacity:1;transform:translateX(-50%) translateY(0)}
.small-note{font-size:10px;color:#63809d;line-height:1.5;margin-top:12px}
.menu-stats{display:flex;justify-content:center;gap:18px;margin:8px 0 12px;color:#9bb7d0;font-size:11px;flex-wrap:wrap}
.menu-stats b{color:#ffb703}
.shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;background:#0a1526;border:1px solid rgba(0,240,255,.15);border-radius:9px;margin-top:7px;text-align:left}
.shop-item .si-info{flex:1;min-width:0}
.shop-item .si-name{font-size:12px;font-weight:900;color:#00f0ff}
.shop-item .si-desc{font-size:10px;color:#8ba8c3;margin-top:2px}
.shop-item .si-lvl{font-size:9px;color:#ffb703;font-weight:800;margin-top:2px}
.shop-item button{padding:8px 11px;border-radius:7px;background:#ffb703;color:#03050c;border:0;font-weight:900;font-size:11px;cursor:pointer;white-space:nowrap}
.shop-item button:disabled{background:#1a2840;color:#5a7290;cursor:default}
.lock-note{font-size:10px;color:#ffb703;font-weight:800;margin-top:8px;letter-spacing:1px;min-height:14px;transition:opacity .3s}
@media(min-width:520px){#app{height:min(100dvh,900px);border-radius:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="xpBarContainer"><div id="xpBar"></div></div>
  <div id="bossBarContainer"><div id="bossBar"></div></div>
  <div id="hud">
    <div class="hstat score"><div class="val" id="scoreLbl">0</div><div class="lbl">PONTOS</div></div>
    <div class="hstat best"><div class="val" id="bestLbl">0</div><div class="lbl">RECORDE</div></div>
    <div class="hstat wave"><div class="val" id="waveLbl">1</div><div class="lbl">ONDA</div></div>
    <div class="hstat level"><div class="val" id="levelLbl">Nv. 1</div><div class="lbl">NÍVEL</div></div>
    <div class="hstat energy"><div class="val" id="energyLbl">100%</div><div class="lbl">ENERGIA</div></div>
    <div class="hstat coins"><div class="val" id="coinsLbl">0</div><div class="lbl">MOEDAS</div></div>
    <button id="pauseBtn" aria-label="Pausar jogo">Ⅱ</button>
  </div>
  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <div id="infoAlert"></div>
  </div>
  <div id="screenOverlay">
    <div class="menu-card">
      <div class="title" id="overlayTitle">GRID RUNNER</div>
      <div class="subtitle" id="menuSubtitle">CYBER SURVIVOR · Sobrevive o máximo que puderes.</div>
      <div id="overlayStats" class="menu-stats" hidden></div>
      <div id="overlayActions"></div>
      <div class="small-note" id="menuNote">Move-te com o dedo no ecrã (margem anti-gestos de 18px). O disparo é automático.</div>
    </div>
  </div>
</div>
<script>
"use strict";

/* ============================================================
   GRID RUNNER: CYBER SURVIVOR — V51 (Progressão Suave de Inimigos)
   ============================================================ */

(function makeIcon(){
  try{
    const c=document.createElement("canvas");c.width=c.height=192;const g=c.getContext("2d");
    const bg=g.createRadialGradient(96,96,5,96,96,110);bg.addColorStop(0,"#10233e");bg.addColorStop(1,"#03050c");
    g.fillStyle=bg;g.beginPath();g.roundRect(0,0,192,192,38);g.fill();
    g.strokeStyle="#00f0ff";g.lineWidth=6;g.beginPath();g.moveTo(96,28);g.lineTo(153,61);g.lineTo(153,131);g.lineTo(96,164);g.lineTo(39,131);g.lineTo(39,61);g.closePath();g.stroke();
    g.fillStyle="#00f0ff";g.shadowColor="#00f0ff";g.shadowBlur=15;g.beginPath();g.arc(96,96,23,0,Math.PI*2);g.fill();
    const url=c.toDataURL("image/png");
    document.getElementById("dynamicFavicon").href=url;
    document.getElementById("dynamicAppleIcon").href=url;
  }catch(e){}
})();

const SAVE_KEY="gridRunnerBestScoreV51";
const META_KEY="gridRunnerMetaV51";
const PROGRESS_KEY="gridRunnerProgressV51";

const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d",{alpha:false});
const scoreLbl=$("scoreLbl"),bestLbl=$("bestLbl"),levelLbl=$("levelLbl"),energyLbl=$("energyLbl"),coinsLbl=$("coinsLbl"),waveLbl=$("waveLbl");
const xpBar=$("xpBar"),bossBar=$("bossBar"),bossBarContainer=$("bossBarContainer");
const overlay=$("screenOverlay"),overlayTitle=$("overlayTitle"),menuSubtitle=$("menuSubtitle"),
      overlayActions=$("overlayActions"),overlayStats=$("overlayStats"),menuNote=$("menuNote"),infoAlert=$("infoAlert");

/* ── META PERKS ── */
const META_PERKS={
  hp:      {name:"Núcleo Reforçado", desc:"+20 energia inicial",      cost:50,  max:5},
  speed:   {name:"Servos",           desc:"+0.15 velocidade inicial", cost:40,  max:5},
  fire:    {name:"Acelerador",       desc:"+8% cadência inicial",     cost:60,  max:5},
  magnet:  {name:"Campo Magnético",  desc:"+25 raio de recolha",      cost:35,  max:3},
  coinGain:{name:"Extrator",         desc:"+15% moedas ganhas",       cost:80,  max:3},
  revive:  {name:"Backup",           desc:"+1 revive por run",        cost:200, max:2}
};
function loadMeta(){
  try{ const m=JSON.parse(localStorage.getItem(META_KEY)||"null"); if(m&&m.perms) return m; }catch(e){}
  return {coins:0, perms:{}};
}
function saveMeta(m){ try{localStorage.setItem(META_KEY, JSON.stringify(m))}catch(e){} }
let meta=loadMeta();

/* ── STATE ── */
let bestScore=0;try{bestScore=Number(localStorage.getItem(SAVE_KEY))||0}catch(e){}
let running=false,paused=false,gameOver=false;
let score=0,level=1,xp=0,maxXp=45,energy=100;
let player,enemies=[],bullets=[],gems=[],energyCells=[],particles=[],boss=null,pendingUpgrade=null;
let spawnClock=0,cellClock=0,idleClock=0,alertClock=0,saveClock=0;
let lastFrame=0,raf=0;
let wave=0,waveClock=0;
let upgradeQueue=0;
let runStartTime=0;
let revivesLeft=0;
let lastEarnedCoins=0;
let screenShake=0;
let hasSavedProgress=false;

let cardsLockUntil=0;

const keys=Object.create(null);
const joystick={active:false,id:null,startX:0,startY:0,x:0,y:0,dx:0,dy:0};
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const TYPES={
  bug:    {hp:1,speed:1.15,r:8, color:"#70e000",score:12,xp:5, damage:6},
  glitch: {hp:2,speed:1.40,r:10,color:"#00d9ff",score:18,xp:6, damage:8},
  worm:   {hp:3,speed:0.75,r:14,color:"#ff3864",score:28,xp:8, damage:10},
  runner: {hp:2,speed:1.80,r:8, color:"#bd83ff",score:22,xp:7, damage:9},
  tank:   {hp:5,speed:0.60,r:17,color:"#ff9f1c",score:40,xp:12,damage:12}
};

const WAVES=[
  {t:0,   name:"Inicialização", mult:1.0},
  {t:60,  name:"Enxame",        mult:1.1},
  {t:120, name:"Glitches",      mult:1.2},
  {t:180, name:"Corredores",    mult:1.35},
  {t:240, name:"Tanques",       mult:1.5},
  {t:320, name:"⚠ BOSS",        mult:1.7},
  {t:400, name:"Caos",          mult:1.9},
  {t:500, name:"⚠ BOSS 2",      mult:2.2},
  {t:620, name:"Colapso",       mult:2.5}
];

const MAX_ENEMIES_PER_WAVE=[6,9,14,19,25,32,40,48,58];
function getMaxEnemies(){
  const idx=Math.min(wave,MAX_ENEMIES_PER_WAVE.length-1);
  return MAX_ENEMIES_PER_WAVE[idx];
}

/* ── PROGRESS SAVE / LOAD ── */
function saveProgress(){
  if(!running || gameOver || !player) return;
  try{
    const data={
      score,level,xp,maxXp,energy,wave,waveClock,
      player:{...player},
      enemies,gems,energyCells,boss,
      runStartTime
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
    hasSavedProgress=true;
  }catch(e){}
}

function clearProgress(){
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
  hasSavedProgress=false;
}

function restoreProgress(){
  try{
    const raw=localStorage.getItem(PROGRESS_KEY);
    if(!raw) return false;
    const p=JSON.parse(raw);
    if(!p || !p.player || p.energy<=0) return false;
    score=p.score||0; level=p.level||1; xp=p.xp||0; maxXp=p.maxXp||45; energy=p.energy||100;
    wave=p.wave||0; waveClock=p.waveClock||0; runStartTime=p.runStartTime||performance.now();
    player={...newPlayer(cv.clientWidth,cv.clientHeight), ...p.player};
    enemies=p.enemies||[]; gems=p.gems||[]; energyCells=p.energyCells||[]; boss=p.boss||null;
    if(boss) bossBarContainer.style.display="block";
    return true;
  }catch(e){ return false; }
}

/* ── UI ── */
function showAlert(msg){
  infoAlert.textContent=msg;infoAlert.classList.add("show");
  clearTimeout(alertClock);alertClock=setTimeout(()=>infoAlert.classList.remove("show"),2200);
}
function vibrate(p=100){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function resizeCanvas(){
  const wrap=$("gamewrap"),w=Math.max(1,wrap.clientWidth),h=Math.max(1,wrap.clientHeight),
        dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+"px";cv.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(player){
    player.x=clamp(player.x,player.radius,w-player.radius);
    player.y=clamp(player.y,player.radius,h-player.radius);
  }
}
function updateHUD(){
  scoreLbl.textContent=Math.floor(score).toLocaleString("pt-PT");
  bestLbl.textContent=Math.floor(bestScore).toLocaleString("pt-PT");
  waveLbl.textContent=(wave+1)+"/"+WAVES.length;
  levelLbl.textContent="Nv. "+level;
  energyLbl.textContent=Math.max(0,Math.ceil(energy))+"%";
  const estimated=Math.max(0,Math.floor(score/50));
  coinsLbl.textContent=(meta.coins+(running?estimated:0)).toLocaleString("pt-PT");
  
  const xpPct = clamp((xp / maxXp) * 100, 0, 100);
  xpBar.style.width = xpPct + "%";

  if(boss)bossBar.style.width=clamp(boss.hp/boss.maxHp*100,0,100)+"%";
}
function saveBest(){
  if(score>bestScore){bestScore=Math.floor(score);try{localStorage.setItem(SAVE_KEY,String(bestScore))}catch(e){}}
  updateHUD();
}

/* ── PLAYER ── */
function newPlayer(w,h){
  const p=meta.perms||{};
  const maxE=100+(p.hp||0)*20;
  return {
    x:w/2,y:h/2,radius:13,
    speed:3.9+(p.speed||0)*.15,
    fireRate:28*Math.pow(.91,(p.fire||0)),
    fireTimer:0,damage:1,bulletCount:1,
    range:200,
    pickupRadius:90+(p.magnet||0)*25,
    weaponType:"plasma",invulnerable:0,
    maxEnergy:maxE,
    regen:0,orbitals:0,nova:0,critChance:0,pierce:0
  };
}

/* ── PARTICLES ── */
function burst(x,y,color,count=8,speed=3){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=rand(1,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:rand(2,4)});
  }
}
function updateParticles(step){
  for(const p of particles){
    p.x+=p.vx*step;p.y+=p.vy*step;
    p.vx*=.94;p.vy*=.94;
    p.life-=.025*step;
  }
  particles.splice(0,particles.length,...particles.filter(p=>p.life>0));
}
function renderParticles(){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

/* ── CARDS ── */
function showUpgradeCards(){
  if(!overlay.classList.contains("hidden")) return;
  paused=true;
  joystick.active=false;joystick.id=null;joystick.dx=joystick.dy=0;

  const LOCK_MS=800;
  cardsLockUntil=performance.now()+LOCK_MS;

  const pool=[
    {id:"rapid",  rarity:"comum", name:"⚡ Overclock",     desc:"+18% cadência de tiro",      apply:()=>player.fireRate=Math.max(6,player.fireRate*.82)},
    {id:"range",  rarity:"comum", name:"🎯 Mira Ampliada", desc:"+45 alcance",                 apply:()=>player.range+=45},
    {id:"damage", rarity:"comum", name:"⚔ Plasma Pesado",  desc:"+1 dano",                     apply:()=>player.damage+=1},
    {id:"speed",  rarity:"comum", name:"🚀 Propulsor",     desc:"+0.35 velocidade",            apply:()=>player.speed=Math.min(5.8,player.speed+.35)},
    {id:"shield", rarity:"comum", name:"🛡 Blindagem",     desc:"+35% energia",                apply:()=>energy=Math.min(player.maxEnergy,energy+player.maxEnergy*.35)},
    {id:"magnet", rarity:"comum", name:"🧲 Ímã de XP",     desc:"+70 raio de recolha",         apply:()=>player.pickupRadius=(player.pickupRadius||90)+70},
    {id:"crit",   rarity:"raro",  name:"🎲 Crítico",       desc:"+15% chance de 2x dano",      apply:()=>player.critChance=(player.critChance||0)+.15},
    {id:"pierce", rarity:"raro",  name:"🗡 Perfurante",    desc:"Balas atravessam 1 inimigo",  apply:()=>player.pierce=(player.pierce||0)+1},
    {id:"regen",  rarity:"raro",  name:"💚 Regeneração",   desc:"+1.2% energia/seg",           apply:()=>player.regen=(player.regen||0)+1.2},
    {id:"orbit",  rarity:"épico", name:"🪐 Satélite",      desc:"Orbe que dispara sozinho",    apply:()=>player.orbitals=(player.orbitals||0)+1},
    {id:"nova",   rarity:"épico", name:"💥 Nova",          desc:"Explosão defensiva ao levar dano", apply:()=>player.nova=(player.nova||0)+1}
  ];
  const colors={comum:"#00f0ff",raro:"#bd83ff","épico":"#ffb703"};
  const picks=[];
  const usedIdx=new Set();
  let safety=0;
  while(picks.length<3 && safety++<100){
    const roll=Math.random()*100;
    const rarity=roll<60?"comum":roll<90?"raro":"épico";
    const cand=pool.map((c,i)=>({c,i})).filter(o=>o.c.rarity===rarity&&!usedIdx.has(o.i));
    if(cand.length){
      const pick=cand[Math.floor(Math.random()*cand.length)];
      usedIdx.add(pick.i);picks.push(pick.c);
    }
  }
  while(picks.length<3){
    const idx=Math.floor(Math.random()*pool.length);
    if(!usedIdx.has(idx)){usedIdx.add(idx);picks.push(pool[idx])}
  }

  overlay.classList.remove("hidden");
  overlayTitle.textContent="⬆ NÍVEL "+(level+1);
  menuSubtitle.textContent="Escolhe uma melhoria táctica";
  overlayStats.hidden=true;
  overlayActions.innerHTML="";

  const lockNote=document.createElement("div");
  lockNote.className="lock-note";
  lockNote.textContent="A PREPARAR CARTAS...";
  overlayActions.appendChild(lockNote);

  const buttons=[];
  picks.forEach(opt=>{
    const btn=document.createElement("button");
    btn.className="btn secondary locked";
    btn.style.cssText=`text-align:left;padding:13px 15px;border-color:${colors[opt.rarity]};margin-top:10px`;
    btn.innerHTML=`<b style="color:${colors[opt.rarity]};font-size:14px">${opt.name}</b>
                   <br><small style="opacity:.9;font-weight:600;color:#cfe9ff">${opt.desc}</small>
                   <br><small style="opacity:.55;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:${colors[opt.rarity]}">${opt.rarity}</small>`;

    let downId=null;
    btn.addEventListener("pointerdown",(e)=>{
      if(performance.now()<cardsLockUntil)return;
      downId=e.pointerId;
    });
    btn.addEventListener("pointerup",(e)=>{
      if(downId===null)return;
      if(e.pointerId!==downId)return;
      if(performance.now()<cardsLockUntil)return;
      downId=null;
      selectCard(opt);
    });
    buttons.push(btn);
    overlayActions.appendChild(btn);
  });

  setTimeout(()=>{
    lockNote.textContent="";
    buttons.forEach(b=>b.classList.remove("locked"));
  },LOCK_MS);

  let picked=false;
  function selectCard(opt){
    if(picked)return;
    picked=true;
    opt.apply();
    level++;
    maxXp=Math.floor(maxXp*1.35+20);
    overlay.classList.add("hidden");
    upgradeQueue--;
    levelLbl.style.transform="scale(1.35)";
    setTimeout(()=>levelLbl.style.transform="scale(1)",200);
    saveProgress();
    if(upgradeQueue>0){showUpgradeCards();return}
    paused=false;lastFrame=0;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
    updateHUD();
  }
  menuNote.textContent="Cada escolha altera a tua build de sobrevivência.";
  updateHUD();
}

/* ── SHOP ── */
function showShop(){
  running=false;paused=false;
  overlay.classList.remove("hidden");
  overlayTitle.textContent="🏪 LOJA";
  menuSubtitle.textContent="Gasta moedas em melhorias permanentes.";
  overlayStats.hidden=false;
  overlayStats.innerHTML=`<span>Moedas: <b>${meta.coins}</b></span>`;
  overlayActions.innerHTML="";
  menuNote.textContent="As melhorias aplicam-se em todas as runs futuras.";

  Object.entries(META_PERKS).forEach(([key,perk])=>{
    const lvl=meta.perms[key]||0;
    const maxed=lvl>=perk.max;
    const canAfford=meta.coins>=perk.cost;
    const div=document.createElement("div");
    div.className="shop-item";
    div.innerHTML=`
      <div class="si-info">
        <div class="si-name">${perk.name}</div>
        <div class="si-desc">${perk.desc}</div>
        <div class="si-lvl">Nv. ${lvl}/${perk.max} · Custo: ${maxed?"MAX":perk.cost+" 🪙"}</div>
      </div>
      <button ${maxed||!canAfford?"disabled":""}>${maxed?"MAX":"COMPRAR"}</button>`;
    const btn=div.querySelector("button");
    if(!maxed&&canAfford){
      btn.onclick=()=>{
        meta.coins-=perk.cost;
        meta.perms[key]=lvl+1;
        saveMeta(meta);vibrate(60);
        showShop();updateHUD();
      };
    }
    overlayActions.appendChild(div);
  });

  const back=document.createElement("button");
  back.className="btn secondary";back.textContent="VOLTAR AO MENU";
  back.style.marginTop="16px";
  back.onclick=()=>showMenu("start");
  overlayActions.appendChild(back);
}

/* ── MENU ── */
function showMenu(mode="start"){
  running=false;paused=false;
  joystick.active=false;joystick.id=null;joystick.dx=joystick.dy=0;
  overlay.classList.remove("hidden");
  overlayActions.innerHTML="";overlayStats.hidden=true;

  if(mode==="pause"){
    saveProgress();
    overlayTitle.textContent="SISTEMA EM PAUSA";
    menuSubtitle.textContent="A partida está guardada e pausada.";
    addButton("CONTINUAR PARTIDA",()=>resumeGame());
    addButton("SAIR PARA O MENU",()=>{saveProgress();showMenu("start")},"secondary");
    menuNote.textContent="O teu progresso foi gravado automaticamente.";
  }else if(mode==="over"){
    clearProgress();
    const elapsed=(performance.now()-runStartTime)/1000;
    const mm=Math.floor(elapsed/60),ss=Math.floor(elapsed%60);
    overlayTitle.textContent="FALHA DE SISTEMA";
    menuSubtitle.textContent="A tua energia chegou a zero.";
    overlayStats.hidden=false;
    overlayStats.innerHTML=`<span>Pontos: <b>${Math.floor(score)}</b></span>
                           <span>Nível: <b>${level}</b></span>
                           <span>Onda: <b>${wave+1}</b></span>
                           <span>Tempo: <b>${mm}m ${ss}s</b></span>
                           <span>Recorde: <b>${bestScore}</b></span>`;
    addButton("TENTAR DE NOVO",()=>startGame(false),"");
    addButton("LOJA 🏪",()=>showShop(),"secondary");
    addButton("MENU",()=>showMenu("start"),"secondary");
    menuNote.textContent=`Ganhaste ${lastEarnedCoins} 🪙 nesta run. Total: ${meta.coins} 🪙`;
  }else{
    overlayTitle.textContent="GRID RUNNER";
    menuSubtitle.textContent="CYBER SURVIVOR · Sobrevive o máximo que puderes.";
    
    try{
      const raw=localStorage.getItem(PROGRESS_KEY);
      hasSavedProgress=!!raw;
    }catch(e){hasSavedProgress=false;}

    if(hasSavedProgress){
      addButton("RETOMAR PARTIDA",()=>startGame(true),"gold");
      addButton("NOVO JOGO",()=>startGame(false),"secondary");
    }else{
      addButton("INICIALIZAR SISTEMA",()=>startGame(false),"");
    }
    addButton("LOJA 🏪 ("+meta.coins+" 🪙)",()=>showShop(),"secondary");
    menuNote.textContent="Progresso guardado automaticamente. Disparo automático.";
  }
  updateHUD();
}
function addButton(label,action,kind=""){
  const b=document.createElement("button");
  b.className="btn "+kind;b.textContent=label;
  b.addEventListener("click",action,{once:true});
  overlayActions.appendChild(b);
}

/* ── START/END ── */
function startGame(resume=false){
  resizeCanvas();
  if(resume && restoreProgress()){
    gameOver=false;paused=false;running=true;screenShake=0;
    overlay.classList.add("hidden");
    updateHUD();
    lastFrame=0;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
    showAlert("💾 PARTIDA RETOMADA!");
    return;
  }

  clearProgress();
  score=0;level=1;xp=0;maxXp=45;
  player=newPlayer(cv.clientWidth,cv.clientHeight);
  energy=player.maxEnergy;
  revivesLeft=meta.perms.revive||0;
  enemies=[];bullets=[];gems=[];energyCells=[];particles=[];
  boss=null;pendingUpgrade=null;
  spawnClock=0;cellClock=0;idleClock=0;
  wave=0;waveClock=0;upgradeQueue=0;
  gameOver=false;paused=false;running=true;
  screenShake=0;
  bossBarContainer.style.display="none";
  overlay.classList.add("hidden");
  updateHUD();
  runStartTime=performance.now();
  saveProgress();
  lastFrame=0;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function resumeGame(){
  paused=false;running=true;
  overlay.classList.add("hidden");
  lastFrame=0;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function endGame(){
  if(revivesLeft>0){
    revivesLeft--;
    energy=player.maxEnergy*0.7;
    enemies=[];bullets=bullets.filter(b=>!b.hostile);
    player.invulnerable=2;
    burst(player.x,player.y,"#00f0ff",35,6);
    showAlert("💾 BACKUP ATIVADO! Revives: "+revivesLeft);
    vibrate([200,80,200]);
    saveProgress();
    updateHUD();
    return;
  }
  energy=0;running=false;paused=false;gameOver=true;
  saveBest();
  clearProgress();
  const gainRate=1+(meta.perms.coinGain||0)*0.15;
  lastEarnedCoins=Math.max(1,Math.floor(score/50*gainRate));
  meta.coins+=lastEarnedCoins;
  saveMeta(meta);
  updateHUD();
  vibrate([140,70,180]);
  cancelAnimationFrame(raf);
  showMenu("over");
}
$("pauseBtn").addEventListener("click",()=>{
  if(running&&!paused){saveProgress();showMenu("pause")}
  else if(paused)resumeGame();
});

/* ── SPAWN ── */
function spawnEnemy(){
  if(boss)return;
  const w=cv.clientWidth,h=cv.clientHeight;
  const edge=Math.floor(Math.random()*4);let x,y;
  if(edge===0){x=rand(0,w);y=-22}
  else if(edge===1){x=rand(0,w);y=h+22}
  else if(edge===2){x=-22;y=rand(0,h)}
  else{x=w+22;y=rand(0,h)}

  const pool=["bug","bug","glitch"];
  if(level>=3)pool.push("worm");
  if(level>=5)pool.push("runner");
  if(level>=8)pool.push("tank");

  const type=pool[Math.floor(Math.random()*pool.length)];
  const base=TYPES[type];
  const extra=Math.max(0,level-1);
  const waveMult=WAVES[wave]?WAVES[wave].mult:1.0;
  const diff=(1+extra*0.035)*waveMult;

  enemies.push({
    x,y,type,
    hp:Math.ceil(base.hp*diff),
    maxHp:Math.ceil(base.hp*diff),
    speed:base.speed*(1+Math.min(extra,30)*0.008),
    radius:base.r,color:base.color,
    damage:Math.round(base.damage+extra*0.5),
    score:base.score,
    xpValue:base.xp
  });
}

function spawnBoss(){
  const w=cv.clientWidth,h=cv.clientHeight;
  const hp=60+level*12+wave*35;
  boss={x:w/2,y:-40,radius:28,hp,maxHp:hp,speed:1.02+Math.min(level,25)*.015,
        phase:1,attackTimer:100,burstTimer:220};
  bossBarContainer.style.display="block";
  updateHUD();
  showAlert("⚠ BOSS DETETADO NA ARENA!");
  vibrate([120,60,120]);
}

function spawnUpgradeModule(){
  const w=cv.clientWidth,h=cv.clientHeight;
  const opts=[
    {id:"rapid", name:"⚡ Overclock",      apply:()=>{player.fireRate=Math.max(6,player.fireRate*.82);showAlert("⚡ Overclock Ativado!")}},
    {id:"range", name:"🎯 Mira Ampliada",  apply:()=>{player.range+=45;showAlert("🎯 Mira Ampliada!")}},
    {id:"damage",name:"⚔ Plasma Pesado",   apply:()=>{player.damage+=1;showAlert("⚔ Plasma Pesado!")}},
    {id:"speed", name:"🚀 Propulsor",      apply:()=>{player.speed=Math.min(5.8,player.speed+.35);showAlert("🚀 Propulsor Ativo!")}},
    {id:"shield",name:"🛡 Blindagem",      apply:()=>{energy=Math.min(player.maxEnergy,energy+player.maxEnergy*.35);showAlert("🛡 Blindagem (+35% Energia)!")}}
  ];
  const chosen=opts[Math.floor(Math.random()*opts.length)];
  pendingUpgrade={
    x:rand(50,w-50),y:rand(50,h-50),
    radius:18,data:chosen
  };
  showAlert("🎁 MÓDULO DE BOSS DISPONÍVEL!");
  vibrate(90);
}

/* ── DAMAGE ── */
function damagePlayer(amount){
  if(player.invulnerable>0)return;
  const dmg=Math.round(amount+(level-1)*0.5);
  energy=Math.max(0,energy-dmg);
  player.invulnerable=.85;
  screenShake=10;
  burst(player.x,player.y,"#ff3864",15,5);
  vibrate([120,40,120]);
  if(player.nova){
    for(const e of enemies) if(dist(player,e)<110){e.hp-=4;burst(e.x,e.y,e.color,6,3)}
    burst(player.x,player.y,"#ff3864",25,6);
    showAlert("💥 NOVA DEFENSIVA!");
  }
  updateHUD();
  if(energy<=0)endGame();
}

/* ── SHOOT ── */
function shoot(){
  let target=null,min=player.range;
  if(boss)target=boss;
  else for(const e of enemies){const d=dist(player,e);if(d<min){min=d;target=e}}
  if(!target)return;
  const angle=Math.atan2(target.y-player.y,target.x-player.x);
  const count=Math.min(5,player.bulletCount);
  for(let i=0;i<count;i++){
    const spread=(i-(count-1)/2)*.15,a=angle+spread;
    bullets.push({
      x:player.x,y:player.y,
      vx:Math.cos(a)*9,vy:Math.sin(a)*9,
      damage:player.damage,life:Math.ceil(player.range/9)+12,
      color:player.bulletCount>1?"#ffb703":"#00f0ff",
      pierceLeft:player.pierce||0
    });
  }
}

/* ── UPDATE ── */
function update(dt){
  if(!running || paused) return;
  const w=cv.clientWidth,h=cv.clientHeight,step=dt*60;

  saveClock+=step;
  if(saveClock>=300){saveClock=0; saveProgress();}

  if(screenShake>0) screenShake=Math.max(0, screenShake - step*0.8);
  if(player.invulnerable>0)player.invulnerable=Math.max(0,player.invulnerable-dt);
  if(player.regen)energy=Math.min(player.maxEnergy,energy+player.regen*dt);

  waveClock+=dt;
  if(wave<WAVES.length-1 && waveClock>=WAVES[wave+1].t){
    wave++;
    showAlert("🌊 ONDA "+(wave+1)+": "+WAVES[wave].name);
    vibrate([80,40,80]);
    saveProgress();
  }

  let vx=0,vy=0;
  if(keys.w||keys.arrowup)vy--;
  if(keys.s||keys.arrowdown)vy++;
  if(keys.a||keys.arrowleft)vx--;
  if(keys.d||keys.arrowright)vx++;
  if(vx||vy){const len=Math.hypot(vx,vy);vx/=len;vy/=len}
  if(joystick.active&&(joystick.dx||joystick.dy)){vx=joystick.dx;vy=joystick.dy}
  const moving=Math.hypot(vx,vy)>.08;

  if(moving){
    idleClock=0;
    player.nextIdleDmg=0;
  }else{
    idleClock+=dt;
    if(idleClock>=3.5 && idleClock<3.7){
      showAlert("⚠️ ALERTA: SOBREAQUECIMENTO PRÓXIMO!");
    }
    if(idleClock>=5){
      if(!player.nextIdleDmg||idleClock>=player.nextIdleDmg){
        energy=Math.max(0,energy-5);
        vibrate([100,50,100]);
        showAlert("🔥 SOBREAQUECIMENTO: MOVE-TE!");
        player.nextIdleDmg=idleClock+1.5;
        if(energy<=0){endGame();return}
      }
    }
  }

  player.x=clamp(player.x+vx*player.speed*step,player.radius,w-player.radius);
  player.y=clamp(player.y+vy*player.speed*step,player.radius,h-player.radius);

  if(!boss && !pendingUpgrade && enemies.length < getMaxEnemies()){
    spawnClock+=step;
    // Cadência de spawn mais progressiva e alargada para dar espaço para fugir
    const spawnRate=Math.max(22, 60 - wave*3.2 - level*0.5);
    if(spawnClock>=spawnRate){spawnClock=0;spawnEnemy()}
  }

  cellClock+=step;
  if(cellClock>=650&&energyCells.length<2){
    cellClock=0;
    energyCells.push({x:rand(30,w-30),y:rand(35,h-35),radius:11,value:25,life:600});
  }

  player.fireTimer+=step;
  if(player.fireTimer>=player.fireRate){player.fireTimer=0;shoot()}

  if(player.orbitals){
    for(let i=0;i<player.orbitals;i++){
      const ang=performance.now()/700+i*(Math.PI*2/player.orbitals);
      const ox=player.x+Math.cos(ang)*55,oy=player.y+Math.sin(ang)*55;
      if(Math.floor(performance.now()/120)%25===0&&enemies.length){
        const t=enemies[0];
        const a=Math.atan2(t.y-oy,t.x-ox);
        bullets.push({x:ox,y:oy,vx:Math.cos(a)*7,vy:Math.sin(a)*7,
          damage:1,life:50,color:"#bd83ff",pierceLeft:0});
      }
    }
  }

  for(const b of bullets){b.x+=b.vx*step;b.y+=b.vy*step;b.life-=step}
  bullets=bullets.filter(b=>b.life>0&&b.x>-40&&b.x<w+40&&b.y>-40&&b.y<h+40);

  if(boss){
    const a=Math.atan2(player.y-boss.y,player.x-boss.x);
    boss.x=clamp(boss.x+Math.cos(a)*boss.speed*step,boss.radius,w-boss.radius);
    boss.y=clamp(boss.y+Math.sin(a)*boss.speed*step,boss.radius,h-boss.radius);

    if(boss.phase===1&&boss.hp<boss.maxHp*0.5){
      boss.phase=2;
      showAlert("⚠ BOSS ENFURECEU!");
      screenShake=12;
      burst(boss.x,boss.y,"#ff0055",35,7);
      vibrate([200,80,200]);
    }

    boss.attackTimer-=step;
    if(boss.attackTimer<=0){
      boss.attackTimer=Math.max(65,115-level*1.2);
      const ba=Math.atan2(player.y-boss.y,player.x-boss.x);
      for(let k=-1;k<=1;k++){
        const aa=ba+k*.22;
        bullets.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*2.8,vy:Math.sin(aa)*2.8,
          damage:0,hostile:true,life:110,color:"#ff3864",pierceLeft:0});
      }
    }

    if(boss.phase===2){
      boss.burstTimer-=step;
      if(boss.burstTimer<=0){
        boss.burstTimer=130;
        const n=12;
        for(let i=0;i<n;i++){
          const aa=i/n*Math.PI*2;
          bullets.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*2.3,vy:Math.sin(aa)*2.3,
            damage:0,hostile:true,life:140,color:"#ff3864",pierceLeft:0});
        }
      }
    }

    if(dist(player,boss)<boss.radius+player.radius)damagePlayer(25);
  }

  for(const e of enemies){
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    let ex=Math.cos(a),ey=Math.sin(a);
    if(e.type==="glitch"){
      const wob=Math.sin(performance.now()/300)*0.6;
      ex=Math.cos(a+wob);ey=Math.sin(a+wob);
    }
    e.x+=ex*e.speed*step;e.y+=ey*e.speed*step;
    if(dist(player,e)<e.radius+player.radius){damagePlayer(e.damage);e.hp=0}
  }

  for(const b of bullets){
    if(b.hostile){
      if(dist(player,b)<player.radius+5){b.life=0;damagePlayer(8)}
      continue;
    }
    if(boss&&dist(b,boss)<boss.radius+4){
      boss.hp-=b.damage;
      burst(b.x,b.y,"#ffb703",5,3);
      b.life=0;
      if(boss.hp<=0){
        score+=350+level*15+wave*50;
        screenShake=15;
        burst(boss.x,boss.y,"#ff0055",50,8);
        boss=null;
        bossBarContainer.style.display="none";
        level+=(level%5===0)?2:1;
        xp=0;
        maxXp=Math.floor(maxXp*1.35+20);
        spawnUpgradeModule();
        saveBest();
        saveProgress();
      }
      continue;
    }
    if(!boss){
      for(const e of enemies){
        if(e.hp>0&&dist(b,e)<e.radius+4){
          const isCrit=Math.random()<(player.critChance||0);
          const dmg=b.damage*(isCrit?2:1);
          e.hp-=dmg;
          if(isCrit){burst(e.x,e.y,"#ffb703",8,4)}
          if(e.hp<=0){
            score+=e.score;
            gems.push({x:e.x,y:e.y,value:e.xpValue});
            burst(e.x,e.y,e.color,10,4);
            saveBest();
            b.life=0;
            break;
          }
          if(b.pierceLeft>0){b.pierceLeft--;continue}
          b.life=0;break;
        }
      }
    }
  }
  enemies=enemies.filter(e=>e.hp>0);

  for(const g of gems){
    const d=dist(player,g);
    const pr=player.pickupRadius||90;
    if(d<pr){g.x+=(player.x-g.x)*.14;g.y+=(player.y-g.y)*.14}
    if(d<player.radius+5){g.collected=true;xp+=g.value}
  }
  gems=gems.filter(g=>!g.collected);

  for(const c of energyCells){
    c.life-=step;
    if(dist(player,c)<player.radius+c.radius){
      c.collected=true;
      energy=Math.min(player.maxEnergy,energy+c.value);
      burst(c.x,c.y,"#00f0ff",12,4);
      showAlert("🔋 +"+c.value+"% Energia");
      updateHUD();
    }
  }
  energyCells=energyCells.filter(c=>!c.collected&&c.life>0);

  if(pendingUpgrade&&dist(player,pendingUpgrade)<player.radius+pendingUpgrade.radius){
    pendingUpgrade.data.apply();
    burst(pendingUpgrade.x,pendingUpgrade.y,"#ffb703",22,5);
    pendingUpgrade=null;
    saveProgress();
    updateHUD();
  }

  if(!boss&&!pendingUpgrade&&xp>=maxXp && !paused){
    if(level%5===0){
      xp=0;
      spawnBoss();
    }else{
      xp=0;
      upgradeQueue++;
      saveProgress();
      showUpgradeCards();
    }
  }

  updateParticles(step);
  updateHUD();
}

/* ── RENDER ── */
function render(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#03050c";ctx.fillRect(0,0,w,h);

  ctx.save();
  if(screenShake>0){
    const sx=(Math.random()-0.5)*screenShake;
    const sy=(Math.random()-0.5)*screenShake;
    ctx.translate(sx, sy);
  }

  ctx.strokeStyle="rgba(0,240,255,.055)";ctx.lineWidth=1;
  for(let x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}

  if(boss){
    ctx.save();
    const pulse=boss.phase===2?1+Math.sin(performance.now()/150)*.1:1;
    ctx.fillStyle=boss.phase===2?"#ff3864":"#ff0055";
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;
    ctx.beginPath();ctx.arc(boss.x,boss.y,boss.radius*pulse,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }

  for(const c of energyCells){
    ctx.save();
    ctx.fillStyle="#00f0ff";ctx.shadowColor="#00f0ff";ctx.shadowBlur=13;
    ctx.beginPath();ctx.arc(c.x,c.y,c.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.stroke();
    ctx.restore();
  }

  for(const g of gems){
    ctx.save();
    ctx.fillStyle="#ffb703";ctx.shadowColor="#ffb703";ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(g.x,g.y,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  if(pendingUpgrade){
    ctx.save();
    ctx.fillStyle="#ffb703";ctx.shadowColor="#ffb703";ctx.shadowBlur=22;
    ctx.beginPath();ctx.arc(pendingUpgrade.x,pendingUpgrade.y,pendingUpgrade.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.stroke();
    ctx.strokeStyle="rgba(255,183,3,0.6)";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(pendingUpgrade.x,pendingUpgrade.y,pendingUpgrade.radius+((Date.now()/6)%18),0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  for(const e of enemies){
    ctx.save();
    ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=9;
    ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();
    ctx.restore();
    if(e.maxHp>1){
      ctx.fillStyle="rgba(255,255,255,.25)";
      ctx.fillRect(e.x-e.radius,e.y-e.radius-6,e.radius*2,3);
      ctx.fillStyle="#fff";
      ctx.fillRect(e.x-e.radius,e.y-e.radius-6,e.radius*2*clamp(e.hp/e.maxHp,0,1),3);
    }
  }

  for(const b of bullets){
    ctx.save();
    ctx.fillStyle=b.color||(b.hostile?"#ff3864":"#00f0ff");
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=7;
    ctx.beginPath();ctx.arc(b.x,b.y,b.hostile?4:3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  if(player){
    if(player.orbitals){
      for(let i=0;i<player.orbitals;i++){
        const ang=performance.now()/700+i*(Math.PI*2/player.orbitals);
        const ox=player.x+Math.cos(ang)*55,oy=player.y+Math.sin(ang)*55;
        ctx.save();
        ctx.fillStyle="#bd83ff";ctx.shadowColor="#bd83ff";ctx.shadowBlur=12;
        ctx.beginPath();ctx.arc(ox,oy,5,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
    }
    ctx.save();
    let pColor="#00f0ff";
    if(idleClock>=3.5){
      pColor = Math.floor(performance.now()/80)%2===0 ? "#ffb703" : "#ff3864";
    }
    ctx.globalAlpha=player.invulnerable>0&&Math.floor(performance.now()/90)%2===0?.35:1;
    ctx.fillStyle=pColor;ctx.shadowColor=pColor;ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }

  renderParticles();

  if(joystick.active){
    ctx.save();
    ctx.strokeStyle="rgba(0,240,255,.35)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(joystick.startX,joystick.startY,48,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="rgba(0,240,255,.4)";
    ctx.beginPath();ctx.arc(joystick.x,joystick.y,19,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ── LOOP ── */
function loop(now){
  if(!running || paused) return;
  if(!lastFrame)lastFrame=now;
  const dt=Math.min(.035,Math.max(0,(now-lastFrame)/1000));
  lastFrame=now;
  update(dt);render();
  if(running && !paused) raf=requestAnimationFrame(loop);
}

/* ── INPUT ── */
function pointerDown(e){
  if(!running||paused||joystick.active)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const margin=18;
  if(x<margin||x>r.width-margin||y<margin||y>r.height-margin)return;
  e.preventDefault();
  joystick.active=true;joystick.id=e.pointerId;
  joystick.startX=x;joystick.startY=y;joystick.x=x;joystick.y=y;
  joystick.dx=0;joystick.dy=0;
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
}
function pointerMove(e){
  if(!joystick.active||e.pointerId!==joystick.id)return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  joystick.x=e.clientX-r.left;joystick.y=e.clientY-r.top;
  const dx=joystick.x-joystick.startX,dy=joystick.y-joystick.startY,
        d=Math.hypot(dx,dy),radius=48;
  if(d>0){
    const scale=Math.min(1,d/radius);
    joystick.dx=dx/d*scale;joystick.dy=dy/d*scale;
  }
}
function pointerEnd(e){
  if(joystick.active&&e.pointerId===joystick.id){
    joystick.active=false;joystick.id=null;
    joystick.dx=joystick.dy=0;
  }
}
cv.addEventListener("pointerdown",pointerDown,{passive:false});
cv.addEventListener("pointermove",pointerMove,{passive:false});
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
cv.addEventListener("lostpointercapture",pointerEnd);

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==="escape"&&running&&!paused){saveProgress();showMenu("pause")}
},{passive:false});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

window.addEventListener("blur",()=>{if(running&&!paused){saveProgress();showMenu("pause")}});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&running&&!paused){saveProgress();}
});
window.addEventListener("beforeunload",saveProgress);

window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",()=>setTimeout(resizeCanvas,150));

/* ── INIT ── */
resizeCanvas();
bestLbl.textContent=bestScore.toLocaleString("pt-PT");
updateHUD();
showMenu("start");
</script>
