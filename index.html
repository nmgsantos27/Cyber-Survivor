<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#03050c">
<title>Grid Runner: Cyber Survivor</title>

<!-- Configurações PWA e Atalho no Ecrã Principal -->
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GridRunner">
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicAppleIcon" rel="apple-touch-icon">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#03050c; color:#00f0ff; font-family:"Rajdhani",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; justify-content:center; align-items:center; }
  #app { width:100%; max-width:500px; height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; background:#03050c; overflow:hidden; border: 1px solid rgba(0,240,255,0.2); }
  #hud { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:rgba(5,10,25,0.95); border-bottom:1px solid rgba(0,240,255,0.2); flex-shrink:0; z-index:5; }
  .hstat { display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .hstat .val { font-size:13px; font-weight:800; text-shadow:0 0 8px currentColor; }
  .hstat .lbl { font-size:7px; font-weight:700; color:#5a80a2; margin-top:2px; letter-spacing:0.5px; }
  .hstat.score .val { color:#00f0ff; }
  .hstat.best .val { color:#ffb703; }
  .hstat.level .val { color:#9d4edd; }
  .hstat.life .val { color:#ff0055; }
  #gamewrap { flex:1; width:100%; position:relative; background:#03050c; overflow:hidden; }
  canvas#cv { display:block; width:100%; height:100%; touch-action:none; }
  #xpBarContainer { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(0,240,255,0.1); z-index:6; }
  #xpBar { height:100%; background:#ffb703; width:0%; transition:width 0.1s linear; box-shadow:0 0 8px #ffb703; }
  
  #screenOverlay { position:absolute; inset:0; background:rgba(3,5,12,0.94); backdrop-filter:blur(5px); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; z-index:30; text-align:center; }
  #screenOverlay.hidden { display:none; }
  .menu-card { max-width:380px; width:100%; background:#070e22; border:1px solid rgba(0,240,255,0.3); border-radius:14px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(0,240,255,0.1); }
  .title { font-size:26px; font-weight:900; color:#00f0ff; margin-bottom:8px; text-shadow:0 0 12px rgba(0,240,255,0.6); }
  .subtitle { font-size:12px; color:#7a9cb8; font-weight:700; margin-bottom:20px; }
  .btn { width:100%; padding:16px; border-radius:10px; background:#00f0ff; border:none; color:#03050c; font-weight:900; font-size:15px; cursor:pointer; box-shadow:0 0 20px rgba(0,240,255,0.5); margin-top:10px; }
  .btn:active { transform:scale(0.97); }
  
  #levelUpModal { position:absolute; inset:0; background:rgba(3,5,12,0.96); backdrop-filter:blur(6px); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; z-index:35; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  #levelUpModal.show { opacity:1; pointer-events:auto; }
  .upgrade-opt { width:100%; max-width:360px; background:#0d1836; border:1px solid rgba(0,240,255,0.3); border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; text-align:left; transition:all 0.15s; }
  .upgrade-opt:active { background:#142450; transform:scale(0.98); }
  .upgrade-opt .u-title { font-size:15px; font-weight:900; color:#ffb703; }
  .upgrade-opt .u-desc { font-size:11px; color:#7a9cb8; font-weight:600; margin-top:3px; }

  #infoAlert { position:absolute; top:15%; left:50%; transform:translateX(-50%); background:rgba(5,10,25,0.95); border:1px solid #9d4edd; color:#9d4edd; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:800; pointer-events:none; opacity:0; transition:opacity 0.3s; z-index:20; box-shadow:0 0 15px rgba(157,78,221,0.4); text-align:center; }
  #infoAlert.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <div id="xpBarContainer"><div id="xpBar"></div></div>
  <div id="hud">
    <div class="hstat score"><div class="val" id="scoreLbl">0</div><div class="lbl">PONTOS</div></div>
    <div class="hstat best"><div class="val" id="bestLbl">0</div><div class="lbl">RECORDE</div></div>
    <div class="hstat level"><div class="val" id="levelLbl">Nv. 1</div><div class="lbl">NÍVEL</div></div>
    <div class="hstat life"><div class="val" id="lifeLbl">❤️❤️❤️</div><div class="lbl">INTEGRIDADE</div></div>
  </div>
  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <div id="infoAlert"></div>
  </div>

  <div id="screenOverlay">
    <div class="menu-card">
      <div class="title">GRID RUNNER</div>
      <div class="subtitle" id="menuSubtitle">Modo Hardcore: Se saíres do jogo, o teu progresso fica gravado automaticamente para poderes continuar!</div>
      <button class="btn" id="startBtn">INICIALIZAR SISTEMA</button>
    </div>
  </div>

  <div id="levelUpModal">
    <div class="menu-card" style="text-align:center;">
      <div class="title" style="color:#ffb703;">⚡ UPGRADE DE SISTEMA</div>
      <div class="subtitle">Escolhe um módulo de melhoria:</div>
      <div id="upgradeList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script>
"use strict";

(function generateAppIcon() {
  const iconCv = document.createElement('canvas');
  iconCv.width = 512; iconCv.height = 512;
  const ictx = iconCv.getContext('2d');

  const grad = ictx.createRadialGradient(256, 256, 0, 256, 256, 256);
  grad.addColorStop(0, '#070e22');
  grad.addColorStop(1, '#03050c');
  ictx.fillStyle = grad;
  ictx.beginPath();
  ictx.roundRect(0, 0, 512, 512, 110);
  ictx.fill();

  ictx.strokeStyle = '#00f0ff';
  ictx.lineWidth = 8;
  ictx.globalAlpha = 0.4;
  ictx.beginPath();
  ictx.roundRect(32, 32, 448, 448, 90);
  ictx.stroke();
  ictx.globalAlpha = 1.0;

  ictx.strokeStyle = '#ff0055';
  ictx.lineWidth = 12;
  ictx.shadowColor = '#ff0055';
  ictx.shadowBlur = 15;
  ictx.beginPath();
  ictx.moveTo(256, 90); ictx.lineTo(400, 174); ictx.lineTo(400, 338);
  ictx.lineTo(256, 422); ictx.lineTo(112, 338); ictx.lineTo(112, 174);
  ictx.closePath();
  ictx.stroke();

  ictx.fillStyle = 'rgba(0, 240, 255, 0.15)';
  ictx.strokeStyle = '#00f0ff';
  ictx.lineWidth = 10;
  ictx.shadowColor = '#00f0ff';
  ictx.shadowBlur = 15;
  ictx.beginPath();
  ictx.moveTo(256, 130); ictx.lineTo(366, 194); ictx.lineTo(366, 318);
  ictx.lineTo(256, 382); ictx.lineTo(146, 318); ictx.lineTo(146, 194);
  ictx.closePath();
  ictx.fill();
  ictx.stroke();

  ictx.fillStyle = '#00f0ff';
  ictx.beginPath();
  ictx.arc(256, 256, 65, 0, Math.PI * 2);
  ictx.fill();

  ictx.fillStyle = '#fff';
  ictx.beginPath();
  ictx.arc(256, 256, 30, 0, Math.PI * 2);
  ictx.fill();

  const iconDataUrl = iconCv.toDataURL('image/png');
  document.getElementById('dynamicFavicon').href = iconDataUrl;
  document.getElementById('dynamicAppleIcon').href = iconDataUrl;
})();

const SAVE_KEY = "gridRunnerBestScoreV11";
const PROGRESS_KEY = "gridRunnerActiveProgressV1";
let bestScore = 0;
try { const saved = localStorage.getItem(SAVE_KEY); if (saved) bestScore = parseInt(saved, 10) || 0; } catch(_) {}

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const scoreLbl = document.getElementById("scoreLbl"), bestLbl = document.getElementById("bestLbl"), levelLbl = document.getElementById("levelLbl"), lifeLbl = document.getElementById("lifeLbl");
const xpBar = document.getElementById("xpBar"), screenOverlay = document.getElementById("screenOverlay"), startBtn = document.getElementById("startBtn");
const menuSubtitle = document.getElementById("menuSubtitle");
const levelUpModal = document.getElementById("levelUpModal"), upgradeList = document.getElementById("upgradeList");
const infoAlert = document.getElementById("infoAlert");

bestLbl.textContent = bestScore;

let running = false, score = 0, level = 1, xp = 0, maxXp = 45, lives = 3;
let waitingForSync = false;
let syncCore = null;

let player = { x: 0, y: 0, radius: 14, speed: 3.8, fireRate: 35, fireTimer: 0, damage: 1, bulletCount: 1, range: 170 };
let enemies = [], gems = [], bullets = [];
let joystick = { active: false, id: null, startX: 0, startY: 0, curX: 0, curY: 0, dx: 0, dy: 0 };
let keys = {};

let alertTimer = 0;
function showAlert(msg) {
  infoAlert.textContent = msg;
  infoAlert.classList.add("show");
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => infoAlert.classList.remove("show"), 2200);
}

function resizeCanvas(){
  const wrap = document.getElementById("gamewrap");
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || 400;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!running && player.x === 0) { player.x = w / 2; player.y = h / 2; }
}
window.addEventListener("resize", resizeCanvas);

// Verificar se existe progresso gravado ao carregar a página
let hasSavedProgress = false;
try {
  const savedProg = localStorage.getItem(PROGRESS_KEY);
  if (savedProg) {
    const p = JSON.parse(savedProg);
    if (p && p.lives > 0) {
      hasSavedProgress = true;
      score = p.score; level = p.level; xp = p.xp; maxXp = p.maxXp; lives = p.lives;
      waitingForSync = p.waitingForSync; syncCore = p.syncCore;
      player = p.player;
    }
  }
} catch(_) {}

if (hasSavedProgress) {
  menuSubtitle.textContent = `Progresso guardado detetado (Nv. ${level}, ${score} pontos). Poca abaixo para continuar!`;
  startBtn.textContent = "CONTINUAR PARTIDA";
}

function saveProgress() {
  if (!running) return;
  try {
    const data = {
      score, level, xp, maxXp, lives, waitingForSync, syncCore,
      player: { x: player.x, y: player.y, speed: player.speed, fireRate: player.fireRate, damage: player.damage, bulletCount: player.bulletCount, range: player.range }
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  } catch(_) {}
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch(_) {}
}

function startGame(resume = false){
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!resume || !hasSavedProgress) {
    clearProgress();
    player.x = w / 2; player.y = h / 2;
    score = 0; level = 1; xp = 0; maxXp = 45; lives = 3;
    waitingForSync = false; syncCore = null;
    player.speed = 3.8; player.fireRate = 35; player.damage = 1; player.bulletCount = 1; player.range = 170;
    enemies = []; gems = []; bullets = [];
  }
  screenOverlay.classList.add("hidden");
  running = true;
  updateHUD();
}

startBtn.addEventListener("click", () => startGame(hasSavedProgress));

// Gravar progresso se sair da página ou fechar a aba
window.addEventListener("beforeunload", () => {
  saveProgress();
});

// Gravar também quando a app vai para segundo plano no telemóvel (visibilitychange)
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    saveProgress();
  }
});

window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  if (!joystick.active) {
    joystick.active = true;
    joystick.id = e.pointerId;
    joystick.startX = e.clientX - r.left;
    joystick.startY = e.clientY - r.top;
    joystick.curX = joystick.startX;
    joystick.curY = joystick.startY;
    joystick.dx = 0; joystick.dy = 0;
  }
});

cv.addEventListener("pointermove", e => {
  if (!joystick.active || e.pointerId !== joystick.id) return;
  const r = cv.getBoundingClientRect();
  joystick.curX = e.clientX - r.left;
  joystick.curY = e.clientY - r.top;
  const dx = joystick.curX - joystick.startX;
  const dy = joystick.curY - joystick.startY;
  const dist = Math.hypot(dx, dy);
  const maxRadius = 45;

  if (dist > 0) {
    const angle = Math.atan2(dy, dx);
    const clampedDist = Math.min(dist, maxRadius);
    joystick.dx = (Math.cos(angle) * clampedDist) / maxRadius;
    joystick.dy = (Math.sin(angle) * clampedDist) / maxRadius;
  }
});

function endJoystick(e) {
  if (joystick.active && e.pointerId === joystick.id) {
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
  }
}
cv.addEventListener("pointerup", endJoystick);
cv.addEventListener("pointercancel", endJoystick);

function updateHUD(){
  scoreLbl.textContent = score;
  bestLbl.textContent = bestScore;
  levelLbl.textContent = "Nv. " + level;
  xpBar.style.width = Math.min(100, (xp / maxXp) * 100) + "%";
  let hStr = ""; for(let i=0; i<lives; i++) hStr += "❤️";
  lifeLbl.textContent = hStr;
}

function spawnEnemy(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random() * w; y = -20; }
  else if (edge === 1) { x = Math.random() * w; y = h + 20; }
  else if (edge === 2) { x = -20; y = Math.random() * h; }
  else { x = w + 20; y = Math.random() * h; }

  const types = ["bug", "glitch", "worm"];
  const type = types[Math.floor(Math.random() * Math.min(types.length, 1 + Math.floor(level/2)))];
  let hp = 1, speed = 1.9, color = "#70e000", radius = 9;
  if (type === "glitch") { hp = 2; speed = 2.5; color = "#00f0ff"; radius = 10; }
  else if (type === "worm") { hp = 4; speed = 1.2; color = "#ff0055"; radius = 14; }

  enemies.push({ x, y, hp, maxHp: hp, speed: speed * (1 + level * 0.04), color, radius, type });
}

function triggerLevelUp(){
  running = false;
  clearProgress(); // Limpa o progresso pendente ao passar de nível para gravar limpo no próximo
  hasSavedProgress = false;
  levelUpModal.classList.add("show");
  upgradeList.innerHTML = "";

  const options = [
    { title: "⚡ Overclock de Cadência", desc: "Aumenta a velocidade de disparo em 20%.", apply: () => { player.fireRate = Math.max(10, player.fireRate * 0.8); } },
    { title: "🎯 Módulo de Precisão", desc: "Aumenta o raio de alcance dos disparos automáticos.", apply: () => { player.range += 35; } },
    { title: "⚔️ Núcleo de Dano", desc: "Aumenta o dano do plasma em +1.", apply: () => { player.damage += 1; } },
    { title: "💥 Dispersão Dupla", desc: "Dispara mais um feixe de plasma por rajada.", apply: () => { player.bulletCount += 1; } }
  ];

  const shuffled = options.sort(() => 0.5 - Math.random()).slice(0, 3);
  shuffled.forEach(opt => {
    const div = document.createElement("div");
    div.className = "upgrade-opt";
    div.innerHTML = `<div class="u-title">${opt.title}</div><div class="u-desc">${opt.desc}</div>`;
    div.addEventListener("click", () => {
      opt.apply();
      levelUpModal.classList.remove("show");
      running = true;
      saveProgress();
    });
    upgradeList.appendChild(div);
  });
}

let spawnTimer = 0;
let saveTimer = 0;

function update(){
  if (!running) return;

  const w = cv.clientWidth, h = cv.clientHeight;

  // Gravar progresso automaticamente a cada 5 segundos de jogo fluido
  saveTimer++;
  if (saveTimer >= 300) {
    saveTimer = 0;
    saveProgress();
  }

  let vx = 0, vy = 0;
  if (keys["w"] || keys["arrowup"]) vy -= 1;
  if (keys["s"] || keys["arrowdown"]) vy += 1;
  if (keys["a"] || keys["arrowleft"]) vx -= 1;
  if (keys["d"] || keys["arrowright"]) vx += 1;

  if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
  
  if (joystick.dx !== 0 || joystick.dy !== 0) {
    vx = joystick.dx;
    vy = joystick.dy;
  }

  player.x += vx * player.speed;
  player.y += vy * player.speed;
  player.x = Math.max(player.radius, Math.min(w - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(h - player.radius, player.y));

  spawnTimer++;
  if (spawnTimer >= Math.max(15, 55 - level * 3)) {
    spawnTimer = 0;
    spawnEnemy();
  }

  player.fireTimer++;
  if (player.fireTimer >= player.fireRate) {
    let target = null, minDist = player.range;
    enemies.forEach(e => {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < minDist) { minDist = d; target = e; }
    });

    if (target) {
      player.fireTimer = 0;
      const angle = Math.atan2(target.y - player.y, target.x - player.x);
      for (let i = 0; i < player.bulletCount; i++) {
        const spread = (i - (player.bulletCount - 1) / 2) * 0.15;
        bullets.push({
          x: player.x, y: player.y,
          vx: Math.cos(angle + spread) * 8,
          vy: Math.sin(angle + spread) * 8,
          dmg: player.damage, life: 60
        });
      }
    }
  }

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; b.life--; });
  bullets = bullets.filter(b => b.life > 0);

  enemies.forEach(e => {
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed;
    e.y += Math.sin(angle) * e.speed;

    if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
      lives--;
      e.hp = 0;
      updateHUD();
      if (lives <= 0) {
        running = false;
        clearProgress();
        hasSavedProgress = false;
        if (score > bestScore) {
          bestScore = score;
          try { localStorage.setItem(SAVE_KEY, bestScore.toString()); } catch(_) {}
        }
        screenOverlay.classList.remove("hidden");
        document.querySelector(".title").textContent = "FALHA DE SISTEMA";
        document.querySelector(".subtitle").innerHTML = `Pontuação: <b>${score}</b> | Recorde: <b>${bestScore}</b><br>Nível atingido: ${level}`;
        startBtn.textContent = "TENTAR DE NOVO";
      }
    }
  });

  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.hp > 0 && Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
        e.hp -= b.dmg;
        b.life = 0;
        if (e.hp <= 0) {
          score += 15;
          if (score > bestScore) bestScore = score;
          if (!waitingForSync) {
            gems.push({ x: e.x, y: e.y, value: 10 });
          }
        }
      }
    });
  });
  enemies = enemies.filter(e => e.hp > 0);

  if (!waitingForSync) {
    gems.forEach(g => {
      const d = Math.hypot(player.x - g.x, player.y - g.y);
      if (d < 65) {
        g.x += (player.x - g.x) * 0.15;
        g.y += (player.y - g.y) * 0.15;
        if (d < player.radius + 6) {
          g.collected = true;
          xp += g.value;
          if (xp >= maxXp) {
            xp = maxXp;
            waitingForSync = true;
            syncCore = {
              x: Math.random() * (w - 80) + 40,
              y: Math.random() * (h - 80) + 40,
              radius: 16
            };
            showAlert("⚠️ NÚCLEO DE SINCRONIZAÇÃO DETETADO NA ARENA!");
          }
          updateHUD();
          saveProgress();
        }
      }
    });
    gems = gems.filter(g => !g.collected);
  } else {
    if (syncCore) {
      const d = Math.hypot(player.x - syncCore.x, player.y - syncCore.y);
      if (d < player.radius + syncCore.radius) {
        waitingForSync = false;
        syncCore = null;
        level++;
        maxXp = Math.floor(maxXp * 1.5);
        xp = 0;
        updateHUD();
        triggerLevelUp();
      }
    }
  }
}

function render(){
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#03050c"; ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = "rgba(0,240,255,0.03)"; ctx.lineWidth = 1;
  const step = 32;
  for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  if (!waitingForSync) {
    gems.forEach(g => {
      ctx.fillStyle = "#ffb703";
      ctx.shadowColor = "#ffb703"; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  if (waitingForSync && syncCore) {
    ctx.fillStyle = "#9d4edd";
    ctx.shadowColor = "#9d4edd"; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(syncCore.x, syncCore.y, syncCore.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "rgba(157, 78, 221, 0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(syncCore.x, syncCore.y, syncCore.radius + ((Date.now() / 8) % 15), 0, Math.PI * 2);
    ctx.stroke();
  }

  enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  bullets.forEach(b => {
    ctx.fillStyle = "#00f0ff";
    ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  ctx.fillStyle = "#00f0ff";
  ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  if (joystick.active) {
    ctx.strokeStyle = "rgba(0,240,255,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joystick.startX, joystick.startY, 45, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(0,240,255,0.4)";
    ctx.beginPath(); ctx.arc(joystick.curX, joystick.curY, 20, 0, Math.PI * 2); ctx.fill();
  }
}

let lastTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  lastTime = now;
  update();
  render();
}

resizeCanvas();
updateHUD();
requestAnimationFrame(loop);
</script>
